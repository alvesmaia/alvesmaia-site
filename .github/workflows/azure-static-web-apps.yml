# Deploy do site e da API para o Azure Static Web Apps.
#
# O token vem de um secret do repositorio, nao da integracao OAuth do Azure
# com o GitHub: o repositorio e publico e a integracao pediria acesso de
# escrita que o deploy nao precisa.
name: Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  verificar:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm ci --prefix api
      - run: npm run verificar

  publicar:
    name: Publicar
    runs-on: ubuntu-latest
    needs: verificar
    if: github.event_name == 'push' || github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # public/ e servido como esta: nao ha build de frontend.
          app_location: public
          api_location: api
          output_location: ''
          skip_app_build: true

  fechar:
    name: Fechar ambiente de pre-visualizacao
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - name: Fechar
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
