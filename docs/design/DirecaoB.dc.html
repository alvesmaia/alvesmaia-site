<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #FFFFFF; font-family: "Nunito Sans", system-ui, sans-serif; color: #102A43; }
    a { color: #0077AB; } a:hover { color: #005E88; }
    p { margin: 0; } h1, h2, h3 { margin: 0; }
  </style>
</helmet>

<div style="width: 620px; background: #FFFFFF;">

  <div style="background: #EDF2F6; padding: 10px 24px; font-size: 11px; letter-spacing: 0.16em; color: #7A8FA3;">ESBOÇO · DIREÇÃO B — BLOCO CROMÁTICO</div>

  <div style="padding: 24px; display: flex; flex-direction: column; gap: 20px;">

    <!-- topo -->
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="width: 96px; height: 14px; background: #102A43;"></div>
      <div style="display: flex; gap: 10px;">
        <div style="width: 34px; height: 8px; background: #C3CFDA;"></div>
        <div style="width: 34px; height: 8px; background: #C3CFDA;"></div>
        <div style="width: 34px; height: 8px; background: #C3CFDA;"></div>
      </div>
    </div>

    <!-- hero em bloco -->
    <div style="background: #102A43; padding: 34px 28px; display: flex; flex-direction: column; gap: 16px;">
      <div style="width: 100%; height: 26px; background: #FFFFFF;"></div>
      <div style="width: 78%; height: 26px; background: #FFFFFF;"></div>
      <div style="width: 52%; height: 26px; background: #00A8E8;"></div>
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <div style="width: 128px; height: 34px; background: #00A8E8;"></div>
        <div style="width: 100px; height: 34px; border: 1px solid #6F92AD;"></div>
      </div>
    </div>

    <!-- quatro blocos cheios -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div style="background: #00A8E8; height: 116px; padding: 16px; display: flex; flex-direction: column; gap: 8px;">
        <div style="width: 40%; height: 10px; background: #0A1B2B;"></div>
        <div style="width: 90%; height: 7px; background: rgba(10,27,43,0.35);"></div>
        <div style="width: 70%; height: 7px; background: rgba(10,27,43,0.35);"></div>
      </div>
      <div style="background: #102A43; height: 116px; padding: 16px; display: flex; flex-direction: column; gap: 8px;">
        <div style="width: 46%; height: 10px; background: #FFFFFF;"></div>
        <div style="width: 88%; height: 7px; background: rgba(255,255,255,0.35);"></div>
        <div style="width: 64%; height: 7px; background: rgba(255,255,255,0.35);"></div>
      </div>
      <div style="background: #102A43; height: 116px; padding: 16px; display: flex; flex-direction: column; gap: 8px;">
        <div style="width: 52%; height: 10px; background: #FFFFFF;"></div>
        <div style="width: 86%; height: 7px; background: rgba(255,255,255,0.35);"></div>
        <div style="width: 60%; height: 7px; background: rgba(255,255,255,0.35);"></div>
      </div>
      <div style="background: #00A8E8; height: 116px; padding: 16px; display: flex; flex-direction: column; gap: 8px;">
        <div style="width: 58%; height: 10px; background: #0A1B2B;"></div>
        <div style="width: 84%; height: 7px; background: rgba(10,27,43,0.35);"></div>
        <div style="width: 66%; height: 7px; background: rgba(10,27,43,0.35);"></div>
      </div>
    </div>

    <!-- faixa de destaque -->
    <div style="background: #0A1B2B; padding: 26px; display: flex; flex-direction: column; gap: 12px;">
      <div style="width: 62%; height: 18px; background: #FFFFFF;"></div>
      <div style="width: 88%; height: 8px; background: rgba(255,255,255,0.3);"></div>
      <div style="width: 74%; height: 8px; background: rgba(255,255,255,0.3);"></div>
    </div>

    <div style="border-top: 1px solid #E4EBF1; padding-top: 16px;">
      <p style="font-size: 13px; line-height: 1.6; color: #40566B;"><strong style="color: #102A43;">Aposta:</strong> presença por cor e escala. Blocos cheios de navy e ciano, tipografia grande, quase nenhuma linha fina.</p>
      <p style="font-size: 13px; line-height: 1.6; color: #7A8FA3; margin-top: 8px;"><strong style="color: #40566B;">Custo:</strong> mais próximo do que muita agência entrega, e o ciano em área grande cansa. Diz menos sobre o que a empresa faz.</p>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
